[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsentrix"
version = "0.1.1"
description = "Agentic Security Framework & Real-Time Threat Visualization Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AgentSentrix Team", email = "contact@agentsentrix.io" }
]
keywords = ["security", "ai-agents", "langgraph", "mcp", "llm-security", "threat-detection", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "duckdb>=0.9.0",
    "uvicorn>=0.20.0"
]

[project.scripts]
agentsentrix = "agentsentrix.cli:app"

[project.urls]
Homepage = "https://github.com/AUXID-01/AgentSentrix"
Documentation = "https://github.com/AUXID-01/AgentSentrix/blob/main/docs/DEVELOPER_SDK_AND_INTEGRATION_GUIDE.md"
Repository = "https://github.com/AUXID-01/AgentSentrix"

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
pythonpath = [".", "core"]
asyncio_mode = "auto"

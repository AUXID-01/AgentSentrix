[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsentrix"
version = "0.1.0"
description = "Agentic Security Framework & Real-Time Threat Visualization Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "duckdb>=0.9.0",
    "redis>=5.0.0",
    "uvicorn>=0.20.0"
]

[tool.pytest.ini_options]
pythonpath = [".", "core"]
asyncio_mode = "auto"

version: "1.0"
rules:
  - id: "SEC-001-ENV-READ"
    name: "Environment Secret Access"
    description: "Detects attempts to read or modify .env or secret configuration files."
    action_types: ["file_read", "file_write", "shell_exec", "tool_call"]
    score: 95
    verdict: "blocked"
    path_patterns:
      - "(?i).*\\.env($|\\..*)"
      - "(?i).*/\\.env.*"
    payload_patterns:
      - "(?i)(cat|head|tail|grep|less|more|vi|vim|nano|python|node).*\\.env"
      - "(?i)printenv|env\\b"

  - id: "SEC-002-SSH-KEY"
    name: "SSH Key Exfiltration"
    description: "Detects unauthorized access to SSH private keys or host credentials."
    action_types: ["file_read", "shell_exec", "tool_call"]
    score: 95
    verdict: "blocked"
    path_patterns:
      - "(?i).*\\.ssh/(id_rsa|id_ed25519|id_dsa|authorized_keys|known_hosts).*"
    payload_patterns:
      - "(?i).*id_rsa.*"
      - "(?i).*id_ed25519.*"

  - id: "SEC-003-AWS-CRED"
    name: "AWS Credentials Exfiltration"
    description: "Detects attempts to access AWS credential files or environment variables."
    action_types: ["file_read", "shell_exec", "tool_call"]
    score: 95
    verdict: "blocked"
    path_patterns:
      - "(?i).*\\.aws/(credentials|config).*"
    payload_patterns:
      - "(?i)cat.*aws/credentials"
      - "(?i)AWS_SECRET_ACCESS_KEY"
      - "(?i)AWS_SESSION_TOKEN"

  - id: "SEC-004-RM-RF"
    name: "Destructive File Deletion"
    description: "Detects high-risk destructive deletion commands (rm -rf)."
    action_types: ["shell_exec", "tool_call"]
    score: 100
    verdict: "blocked"
    payload_patterns:
      - "(?i)rm\\s+(-[a-z]*r[a-z]*f|-[a-z]*f[a-z]*r)\\s+.*"
      - "(?i)rm\\s+-rf\\s+[/\\~\\.\\*]"
      - "(?i)rmdir\\s+/s\\s+/q"

  - id: "SEC-005-CURL-SH"
    name: "Remote Script Execution Pipe"
    description: "Detects piping web contents directly into a shell execution environment."
    action_types: ["shell_exec", "tool_call"]
    score: 90
    verdict: "blocked"
    payload_patterns:
      - "(?i)(curl|wget|fetch)\\s+.*\\|\\s*(bash|sh|zsh|python|perl|php)"

  - id: "SEC-006-GIT-FORCE"
    name: "Dangerous Git Operations"
    description: "Detects forced git pushes or push actions to non-standard remote repositories."
    action_types: ["git_op", "shell_exec", "tool_call"]
    score: 65
    verdict: "quarantined"
    payload_patterns:
      - "(?i)git\\s+push.*(--force|-f)\\b"
      - "(?i)git\\s+push\\s+(?!origin\\b)[a-zA-Z0-9_-]+"

  - id: "SEC-007-BASE64-EXEC"
    name: "Obfuscated Base64 Command Execution"
    description: "Detects execution of base64 encoded strings."
    action_types: ["shell_exec", "tool_call"]
    score: 60
    verdict: "quarantined"
    payload_patterns:
      - "(?i)base64\\s+(-d|--decode)\\s*\\|\\s*(bash|sh|zsh|python)"
      - "(?i)eval\\s*\\(\\s*.*base64"

  - id: "SEC-008-NET-EGRESS"
    name: "Suspicious Outbound Network Call"
    description: "Detects network egress requests targeting raw external IP addresses."
    action_types: ["net_egress", "shell_exec", "tool_call"]
    score: 55
    verdict: "quarantined"
    path_patterns:
      - "http://[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}.*"
      - "https://[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}.*"
    payload_patterns:
      - "(?i)curl\\s+http://[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+"

  - id: "SEC-009-SAFE-READ"
    name: "Safe Document Access"
    description: "Identifies standard documentation and non-sensitive source file operations."
    action_types: ["file_read", "tool_call"]
    score: 10
    verdict: "allowed"
    path_patterns:
      - "(?i).*\\.(md|txt|json|yaml|yml|py|ts|tsx|css|html)$"
